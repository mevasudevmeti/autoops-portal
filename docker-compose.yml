services:
  postgres:
    image: postgres:16
    container_name: autoops-postgres
    environment:
      POSTGRES_DB: autoops
      POSTGRES_USER: autoops
      POSTGRES_PASSWORD: autoops
    ports:
      - "5432:5432"
    volumes:
      - autoops_postgres_data:/var/lib/postgresql/data

volumes:
  autoops_postgres_data: